    <script>
      // Configuração do Supabase
      import { createClient } from '@supabase/supabase-js'
      const supabaseUrl = "https://leuyfasvbfwdaloapmrs.supabase.co";
      const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxldXlmYXN2YmZ3ZGFsb2FwbXJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDExMTczMzUsImV4cCI6MjA1NjY5MzMzNX0.Y_s-KMy9n_Ht2OVaxmQEjnDRniqJ_DcppQVam7uAGk4";
      const supabase = createClient(supabaseUrl, supabaseKey);

      // Função para verificar o estado dos placares
      async function verificarEstadoPlacares() {
        const loggedInUser = localStorage.getItem("loggedInUser");
        const toggleButton = document.getElementById("toggle-visibility");
        const toggleText = document.getElementById("toggle-text");

        if (loggedInUser === "Jardel") {
          toggleButton.classList.remove("hidden");
          toggleButton.addEventListener("click", toggleVisibility);
        } else {
          toggleButton.classList.add("hidden"); // Oculta o botão para outros usuários
        }

        const isHidden = await carregarEstadoVisibilidade();
        if (isHidden) {
          ocultarPlacares();
          toggleText.textContent = "Revelar Placar";
        } else {
          mostrarPlacares();
          toggleText.textContent = "Ocultar Placar";
        }
      }

      // Função para alternar a visibilidade dos placares
      async function toggleVisibility() {
        const isHidden = await carregarEstadoVisibilidade();
        const novoEstado = !isHidden;

        await salvarEstadoVisibilidade(novoEstado);
        verificarEstadoPlacares();
      }

      // Função para salvar o estado de visibilidade no Supabase
      async function salvarEstadoVisibilidade(estado) {
        const { data: rodadas, error } = await supabase
          .from("rodadas")
          .select("*")
          .order("id", { ascending: false })
          .limit(1);

        if (error || rodadas.length === 0) {
          console.error("Erro ao carregar rodadas:", error);
          return;
        }

        const rodadaId = rodadas[0].id;

        const { error: updateError } = await supabase
          .from("rodadas")
          .update({ placares_ocultos: estado })
          .eq("id", rodadaId);

        if (updateError) {
          console.error("Erro ao salvar estado de visibilidade:", updateError);
        }
      }

      // Função para carregar o estado de visibilidade do Supabase
      async function carregarEstadoVisibilidade() {
        const { data: rodadas, error } = await supabase
          .from("rodadas")
          .select("*")
          .order("id", { ascending: false })
          .limit(1);

        if (error || rodadas.length === 0) {
          console.error("Erro ao carregar rodadas:", error);
          return false;
        }

        return rodadas[0].placares_ocultos || false;
      }

      // Função para salvar as apostas no Supabase
      async function salvarApostas() {
        const nomeRodada = document.getElementById("nome-rodada").value;
        const jogos = obterJogosDaTabela();
        const apostas = obterApostasDaTabela();
        const resultados = obterResultadosDaTabela();
        const placaresOcultos = await carregarEstadoVisibilidade();

        // Salvar rodada
        const { data: rodada, error: rodadaError } = await supabase
          .from("rodadas")
          .insert([{ nome: nomeRodada, placares_ocultos: placaresOcultos }])
          .select();

        if (rodadaError) {
          console.error("Erro ao salvar rodada:", rodadaError);
          return;
        }

        const rodadaId = rodada[0].id;

        // Salvar jogos e apostas
        for (let i = 0; i < jogos.length; i++) {
          const [time1, time2] = jogos[i].split(" x ");
          const { data: jogo, error: jogoError } = await supabase
            .from("jogos")
            .insert([{ rodada_id: rodadaId, time1, time2 }])
            .select();

          if (jogoError) {
            console.error("Erro ao salvar jogo:", jogoError);
            continue;
          }

          const jogoId = jogo[0].id;

          // Salvar apostas
          for (const jogador in apostas) {
            const { time1, time2 } = apostas[jogador][i];
            const { error: apostaError } = await supabase
              .from("apostas")
              .insert([{ rodada_id: rodadaId, jogo_id: jogoId, jogador, time1, time2 }]);

            if (apostaError) {
              console.error("Erro ao salvar aposta:", apostaError);
            }
          }

          // Salvar resultados
          const { time1: resultadoTime1, time2: resultadoTime2 } = resultados[i];
          const { error: resultadoError } = await supabase
            .from("resultados")
            .insert([{ rodada_id: rodadaId, jogo_id: jogoId, time1: resultadoTime1, time2: resultadoTime2 }]);

          if (resultadoError) {
            console.error("Erro ao salvar resultado:", resultadoError);
          }
        }

        console.log("Dados salvos com sucesso no Supabase!");
      }

      // Função para carregar as apostas do Supabase
      async function carregarApostas() {
        const { data: rodadas, error: rodadasError } = await supabase
          .from("rodadas")
          .select("*")
          .order("id", { ascending: false })
          .limit(1);

        if (rodadasError || rodadas.length === 0) {
          console.error("Erro ao carregar rodadas:", rodadasError);
          return;
        }

        const rodadaId = rodadas[0].id;
        document.getElementById("nome-rodada").value = rodadas[0].nome;

        const { data: jogos, error: jogosError } = await supabase
          .from("jogos")
          .select("*")
          .eq("rodada_id", rodadaId);

        if (jogosError) {
          console.error("Erro ao carregar jogos:", jogosError);
          return;
        }

        const { data: apostas, error: apostasError } = await supabase
          .from("apostas")
          .select("*")
          .eq("rodada_id", rodadaId);

        if (apostasError) {
          console.error("Erro ao carregar apostas:", apostasError);
          return;
        }

        const { data: resultados, error: resultadosError } = await supabase
          .from("resultados")
          .select("*")
          .eq("rodada_id", rodadaId);

        if (resultadosError) {
          console.error("Erro ao carregar resultados:", resultadosError);
          return;
        }

        preencherTabela(jogos, apostas, resultados);
        calcularPontuacao();
      }

      // Função para preencher a tabela com os dados carregados
      function preencherTabela(jogos, apostas, resultados) {
        const inputsJogos = document.querySelectorAll(".input-jogo");
        const inputsApostas = document.querySelectorAll(".aposta");
        const inputsResultados = document.querySelectorAll(".resultado");

        // Preenche os nomes dos times
        inputsJogos.forEach((input, index) => {
          input.value = jogos[index]?.time1 + " x " + jogos[index]?.time2 || "";
        });

        // Preenche as apostas dos jogadores
        const jogadores = ["Jardel", "Werbet", "Nailton", "Phillipe"];
        jogadores.forEach((jogador, jogadorIndex) => {
          for (let i = 0; i < 10; i++) {
            const indexCasa = i * 8 + jogadorIndex * 2; // Índice do time1
            const indexFora = indexCasa + 1; // Índice do time2
            inputsApostas[indexCasa].value = apostas.find(
              (aposta) => aposta.jogador === jogador && aposta.jogo_id === jogos[i].id
            )?.time1 || "";
            inputsApostas[indexFora].value = apostas.find(
              (aposta) => aposta.jogador === jogador && aposta.jogo_id === jogos[i].id
            )?.time2 || "";
          }
        });

        // Preenche os resultados
        for (let i = 0; i < 10; i++) {
          inputsResultados[i * 2].value = resultados.find(
            (resultado) => resultado.jogo_id === jogos[i].id
          )?.time1 || "";
          inputsResultados[i * 2 + 1].value = resultados.find(
            (resultado) => resultado.jogo_id === jogos[i].id
          )?.time2 || "";
        }
      }

      // Função para calcular a pontuação
      async function calcularPontuacao() {
        const apostas = obterApostasDaTabela();
        const resultados = obterResultadosDaTabela();
        const jogadores = ["Jardel", "Werbet", "Nailton", "Phillipe"];
        const pontos = { Jardel: 0, Werbet: 0, Nailton: 0, Phillipe: 0 };
        const placaresExatos = { Jardel: 0, Werbet: 0, Nailton: 0, Phillipe: 0 };

        for (let i = 0; i < 10; i++) {
          const resultadoCasa = resultados[i].time1;
          const resultadoFora = resultados[i].time2;

          if (resultadoCasa === "" || resultadoFora === "") continue;

          jogadores.forEach((jogador) => {
            const apostaCasa = apostas[jogador][i].time1;
            const apostaFora = apostas[jogador][i].time2;

            if (apostaCasa === "" || apostaFora === "") return;

            if (apostaCasa === resultadoCasa && apostaFora === resultadoFora) {
              pontos[jogador] += 3;
              placaresExatos[jogador] += 1;
            } else if (
              (apostaCasa > apostaFora && resultadoCasa > resultadoFora) ||
              (apostaCasa < apostaFora && resultadoCasa < resultadoFora) ||
              (apostaCasa === apostaFora && resultadoCasa === resultadoFora)
            ) {
              pontos[jogador] += 1;
            }
          });
        }

        const jogadoresOrdenados = Object.entries(pontos).sort((a, b) => b[1] - a[1]);
        const pontuacaoMaxima = jogadoresOrdenados[0][1];
        const vencedores = pontuacaoMaxima > 0
          ? jogadoresOrdenados.filter(([_, pontuacao]) => pontuacao === pontuacaoMaxima)
          : [];

        const pontuacaoHTML = jogadoresOrdenados
          .map(([jogador, pontuacao]) => {
            const isVencedor = vencedores.some(([vencedor]) => vencedor === jogador);
            return `<div class="pontuacao-card ${isVencedor ? "vencedor" : ""}">
                      <h3>${jogador}</h3>
                      <p>${pontuacao} pontos</p>
                    </div>`;
          })
          .join("");

        document.getElementById("pontuacao").innerHTML = pontuacaoHTML;

        // Salvar ranking no Supabase
        await salvarRanking(jogadoresOrdenados);
      }

      // Função para salvar o ranking no Supabase
      async function salvarRanking(jogadoresOrdenados) {
        const { data: rodadas, error: rodadasError } = await supabase
          .from("rodadas")
          .select("*")
          .order("id", { ascending: false })
          .limit(1);

        if (rodadasError || rodadas.length === 0) {
          console.error("Erro ao carregar rodadas:", rodadasError);
          return;
        }

        const rodadaId = rodadas[0].id;

        for (let i = 0; i < jogadoresOrdenados.length; i++) {
          const [jogador, pontuacao] = jogadoresOrdenados[i];
          const { error } = await supabase
            .from("ranking")
            .insert([{ rodada_id: rodadaId, jogador, posicao: i + 1 }]);

          if (error) {
            console.error("Erro ao salvar ranking:", error);
          }
        }
      }

      // Função para fazer logout
      function logout() {
        localStorage.removeItem("loggedInUser");
        document.getElementById("login-container").classList.remove("hidden");
        document.getElementById("main-content").classList.add("hidden");
      }

      // Função para abrir o ranking
      function abrirRanking() {
        window.open("ranking.html", "_blank");
      }

      // Função para lidar com o pressionamento de teclas
      function handleKeyPress(event) {
        if (event.key === "Enter") {
          login();
        }
      }

      // Função para fazer login (mantida conforme original)
      async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        // Lógica de login original (não alterada)
        const senhasCriptografadas = await buscarSenhasCriptografadas();

        if (senhasCriptografadas[username]) {
          const senhaDescriptografada = await descriptografar(senhasCriptografadas[username]);

          if (senhaDescriptografada === password) {
            localStorage.setItem("loggedInUser", username);
            document.getElementById("login-container").classList.add("hidden");
            document.getElementById("main-content").classList.remove("hidden");
            verificarEstadoPlacares();
            carregarApostas();
          } else {
            alert("Nome de usuário ou senha incorretos!");
          }
        } else {
          alert("Nome de usuário ou senha incorretos!");
        }
      }

      // Função para buscar senhas criptografadas (mantida conforme original)
        async function buscarSenhasCriptografadas() {
        try {
          const response = await fetch("/.netlify/functions/senhas");
          if (!response.ok) {
            throw new Error("Erro ao buscar senhas");
          }
          const data = await response.json();
          return data;
        } catch (error) {
          console.error("Erro na requisição:", error);
          alert("Erro ao buscar senhas. Tente novamente.");
          return {};
        }
      }

      // Função para descriptografar (mantida conforme original)
      async function descriptografar(textoCriptografado) {
        try {
          const response = await fetch("/.netlify/functions/descriptografar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ textoCriptografado }),
          });

          if (!response.ok) {
            throw new Error("Erro ao descriptografar");
          }

          const data = await response.json();
          return data.textoDescriptografado;
        } catch (error) {
          console.error("Erro na requisição:", error);
          alert("Erro ao descriptografar. Tente novamente.");
          return null;
        }
      }

      // Função para criar as linhas da tabela
      function criarLinhasTabela() {
        const tabela = document.getElementById("tabela-apostas");

        for (let i = 1; i <= 10; i++) {
          const linha = document.createElement("tr");
          linha.innerHTML = `
            <td>
                <input type="text" class="input-jogo" placeholder="casa x fora">
            </td>
            ${["Jardel", "Werbet", "Nailton", "Phillipe"]
              .map(
                (jogador, jogadorIndex) => `
                <td>
                    <div class="input-container">
                        <input type="number" class="aposta input-placar jogador${jogadorIndex}" min="0">
                        <span class="placar-separador">x</span>
                        <input type="number" class="aposta input-placar jogador${jogadorIndex}" min="0">
                    </div>
                </td>
            `
              )
              .join("")}
            <td>
                <div class="input-container">
                    <input type="number" class="resultado input-placar" min="0">
                    <span class="placar-separador">x</span>
                    <input type="number" class="resultado input-placar" min="0">
                </div>
            </td>
        `;
          tabela.appendChild(linha);
        }
      }

      // Função para obter os jogos da tabela
      function obterJogosDaTabela() {
        const jogos = [];
        const inputs = document.querySelectorAll(".input-jogo");
        inputs.forEach((input) => jogos.push(input.value));
        return jogos;
      }

      // Função para obter as apostas da tabela
      function obterApostasDaTabela() {
        const apostas = { Jardel: [], Werbet: [], Nailton: [], Phillipe: [] };
        const inputs = document.querySelectorAll(".aposta");

        for (let i = 0; i < 10; i++) {
          apostas.Jardel.push({
            time1: inputs[i * 8].value,
            time2: inputs[i * 8 + 1].value,
          });
          apostas.Werbet.push({
            time1: inputs[i * 8 + 2].value,
            time2: inputs[i * 8 + 3].value,
          });
          apostas.Nailton.push({
            time1: inputs[i * 8 + 4].value,
            time2: inputs[i * 8 + 5].value,
          });
          apostas.Phillipe.push({
            time1: inputs[i * 8 + 6].value,
            time2: inputs[i * 8 + 7].value,
          });
        }

        return apostas;
      }

      // Função para obter os resultados da tabela
      function obterResultadosDaTabela() {
        const resultados = [];
        const inputs = document.querySelectorAll(".resultado");

        for (let i = 0; i < 10; i++) {
          resultados.push({
            time1: inputs[i * 2].value,
            time2: inputs[i * 2 + 1].value,
          });
        }

        return resultados;
      }
    </script>
