<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a86ff" />
    <title>AlphaBet - Login</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4137968396961098"
     crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  </head>

  <body>
    <div class="login-container" id="login-container">
      <div class="box-container">
        <div class="alpha-bet-title">AlphaBet</div>
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Nome de usuário" />
        <input
          type="password"
          id="password"
          placeholder="Senha"
          onkeydown="handleKeyPress(event)"
        />
        <button onclick="login()">Entrar</button>
      </div>
    </div>

    <div id="main-content" class="hidden">
      <!-- Conteúdo principal (tabela de apostas) -->
      <div class="container-titulo">
        <!-- As letras do título serão inseridas aqui pelo script -->
      </div>

      <!-- Botão de ocultar/revelar (visível apenas para Jardel) -->
      <div class="toggle-visibility-container">
        <button id="toggle-visibility" class="hidden">
          <span id="toggle-text">Ocultar Placar</span>
        </button>
        <button id="ranking-button" onclick="abrirRanking()">Ranking</button>
        <button id="preencher-tabela-principal" class="hidden">
          <span>Preencher Tabela</span>
        </button>
      </div>
      <button id="toggle-dark-mode">🌙 Dark Mode</button>

      <!-- Painel de status "Quem já quilou?" -->
      <div id="status-quila-container" class="status-quila-container">
        <div class="status-quila-titulo">Quem já quilou?</div>
        <div class="status-quila-badges">
          <div class="quila-badge pending" data-jogador="Jardel">Jardel</div>
          <div class="quila-badge pending" data-jogador="Werbet">Werbet</div>
          <div class="quila-badge pending" data-jogador="Nailton">Nailton</div>
          <div class="quila-badge pending" data-jogador="Phillipe">
            Phillipe
          </div>
        </div>
      </div>

      <button class="logout-button" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span class="logout-text">SAIR</span>
      </button>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>
                <input
                  type="text"
                  id="nome-rodada"
                  placeholder="Nome da Rodada"
                />
              </th>
              <th>Jardel</th>
              <th>Werbet</th>
              <th>Nailton</th>
              <th>Phillipe</th>
              <th>Resultado</th>
            </tr>
          </thead>
          <tbody id="tabela-apostas">
            <!-- Linhas das partidas serão inseridas aqui pelo script -->
          </tbody>
        </table>
      </div>

      <div id="feedback-apostas" class="feedback-completo">
        <i class="fas fa-check-circle"></i>
        <span>Suas apostas foram salvas!</span>
      </div>

      <div class="pontuacao-container" id="pontuacao"></div>

      <div class="container">
        <header>
          <h1>Brasileirão Série A</h1>
          <div class="subtitulo">Acompanhe todos os jogos do campeonato</div>
        </header>

        <div class="navegacao">
          <button id="anterior" disabled>&larr; Rodada Anterior</button>
          <span id="rodada-atual"></span>
          <button id="proxima">Próxima Rodada &rarr;</button>
        </div>

        <div id="calendario-jogos">
          <div class="loading">Carregando jogos</div>
        </div>
      </div>

      <footer>
        <div>
          <p>&copy; 2025 Jardel Correia.</p>
          <p>Todos os direitos reservados.</p>
          <p>
            <a href="https://instagram.com/jardelcorreia" target="_blank">
              <i class="fab fa-instagram"></i>
            </a>
          </p>
        </div>
      </footer>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <script src="script.js"></script>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((registration) => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, (err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
