<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlphaBet - Login</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <!--<link rel="stylesheet" href="tabeladejogos.css">-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="styles/main.css">
  </head>

  <body>
    <div class="login-container" id="login-container">
      <div class="box-container">
        <div class="alpha-bet-title">AlphaBet</div>
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Nome de usuário" />
        <input
          type="password"
          id="password"
          placeholder="Senha"
          onkeydown="handleKeyPress(event)"
        />
        <button onclick="login()">Entrar</button>
      </div>
    </div>

    <div id="main-content" class="hidden">
      <!-- Conteúdo principal (tabela de apostas) -->
      <div class="container-titulo">
        <!-- As letras do título serão inseridas aqui pelo script -->
      </div>

      <div class="competition-selector" style="text-align: center; margin-bottom: 20px;">
        <label>
          <input type="radio" name="competition" value="brasileirao" checked> Brasileirão
        </label>
        <label style="margin-left: 15px;">
          <input type="radio" name="competition" value="club_wc"> Club World Cup
        </label>
      </div>

      <!-- Botão de ocultar/revelar (visível apenas para Jardel) -->
      <div class="toggle-visibility-container">
        <button id="toggle-visibility" class="hidden">
          <span id="toggle-text">Ocultar Placar</span>
        </button>
        <button id="ranking-button" onclick="abrirRanking()">Ranking</button>
        <button id="preencher-tabela-principal" class="hidden">
          <span>Preencher Tabela</span>
        </button>
      </div>
      <button id="toggle-dark-mode">🌙 Dark Mode</button>

      <button class="logout-button" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span class="logout-text">SAIR</span>
      </button>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>
                <input
                  type="text"
                  id="nome-rodada"
                  placeholder="Nome da Rodada"
                />
              </th>
              <th>Jardel</th>
              <th>Werbet</th>
              <th>Nailton</th>
              <th>Phillipe</th>
              <th>Resultado</th>
            </tr>
          </thead>
          <tbody id="tabela-apostas">
            <!-- Linhas das partidas serão inseridas aqui pelo script -->
          </tbody>
        </table>
      </div>

      <div id="feedback-apostas" class="feedback-completo">
        <i class="fas fa-check-circle"></i>
        <span>Suas apostas foram salvas!</span>
      </div>

      <div class="pontuacao-container" id="pontuacao"></div>

      <div class="container">
        <header>
          <h1>Brasileirão Série A</h1>
          <div class="subtitulo">Acompanhe todos os jogos do campeonato</div>
        </header>

        <div class="navegacao">
          <button id="anterior" disabled>&larr; Rodada Anterior</button>
          <span id="rodada-atual"></span>
          <button id="proxima">Próxima Rodada &rarr;</button>
        </div>

        <div id="calendario-jogos">
          <div class="loading">Carregando jogos</div>
        </div>
      </div>

      <footer>
        <div>
          <p>&copy; 2025 Jardel Correia.</p>
          <p>Todos os direitos reservados.</p>
          <p>
            <a href="https://instagram.com/jardelcorreia" target="_blank">
              <i class="fab fa-instagram"></i>
            </a>
          </p>
        </div>
      </footer>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <script src="js/main.js"></script>
    </div>
  </body>
</html>
