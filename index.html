  display: inline-block;
  margin: 0 2px; /* Espaço entre as letras */
  animation: moveIn 0.8s ease-out forwards;
  animation-delay: calc(var(--i, 0) * 0.1s); /* Usa a variável CSS com valor padrão */

@keyframes moveIn {

    transform: translateY(-20px);

      window.addEventListener("load", async function () {
  const loggedInUser = localStorage.getItem("loggedInUser");
  if (loggedInUser) {
    document.getElementById("login-container").classList.add("hidden");
    document.getElementById("main-content").classList.remove("hidden");
    await verificarEstadoPlacares(); // Verificar o estado dos placares ao carregar a página
    carregarApostas(); // Carrega as apostas salvas
  } else {
    document.getElementById("login-container").classList.remove("hidden");
    document.getElementById("main-content").classList.add("hidden");
  }
});

      function handleKeyPress(event) {
        if (event.key === "Enter") {
          login();
        }
      }

      // Função debounce para evitar múltiplas chamadas ao servidor
      function debounce(func, wait) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), wait);
        };
      }

      // Função para salvar as apostas com debounce
      const salvarApostasDebounced = debounce(salvarApostas, 500); // 500ms de delay

      // Adiciona eventos de input, change, blur e keydown para salvar automaticamente
      function adicionarEventosSalvamento() {
        const inputs = document.querySelectorAll(
          ".aposta, .resultado, .input-jogo, #nome-rodada"
        );
        inputs.forEach((input) => {
          input.addEventListener("input", salvarApostasDebounced);
          input.addEventListener("change", salvarApostasDebounced);
          input.addEventListener("blur", salvarApostasDebounced);
          input.addEventListener("keydown", function (event) {
            if (event.key === "Delete" || event.key === "Backspace") {
              salvarApostasDebounced();
            }
          });
        });
      }

      // Função corrigida para o título
const titulo = "Brasileirão AlphaBet 2025";
const containerTitulo = document.querySelector(".container-titulo");

// Adiciona as palavras do título com animação
titulo.split(" ").forEach((palavra, palavraIndex) => {
  const divPalavra = document.createElement("div");
  divPalavra.classList.add("palavra");
  
  // Para cada letra da palavra
  palavra.split("").forEach((letra, letraIndex) => {
    const span = document.createElement("span");
    span.textContent = letra;
    span.classList.add("letra");
    span.style.setProperty('--i', letraIndex + palavraIndex * 10); // Define a variável CSS personalizada
    divPalavra.appendChild(span);
  });
  
  containerTitulo.appendChild(divPalavra);
  
  // Adiciona espaço entre as palavras (exceto após a última)
  if (palavraIndex < titulo.split(" ").length - 1) {
    const espaco = document.createElement("div");
    espaco.classList.add("espaco");
    espaco.textContent = " ";
    containerTitulo.appendChild(espaco);
  }
});

      async function toggleVisibility() {
  const isHidden = await carregarEstadoVisibilidade();
  const novoEstado = !isHidden;

  await salvarEstadoVisibilidade(novoEstado);
  verificarEstadoPlacares();
}

function ocultarPlacares() {
  const loggedInUser = localStorage.getItem("loggedInUser");
  const inputsApostas = document.querySelectorAll(".aposta");

  inputsApostas.forEach((input) => {
    const colunaJogador = input.classList.contains("jogador0")
      ? "Jardel"
      : input.classList.contains("jogador1")
      ? "Werbet"
      : input.classList.contains("jogador2")
      ? "Nailton"
      : input.classList.contains("jogador3")
      ? "Phillipe"
      : null;

    // Oculta os placares dos outros jogadores
    if (colunaJogador && colunaJogador !== loggedInUser) {
      input.style.display = "none";
    } else {
      input.style.display = ""; // Mostra os placares do jogador logado
      input.disabled = false; // Permite edição apenas para o jogador logado
      input.style.backgroundColor = "";
    }
  });
}

function mostrarPlacares() {
  const inputsApostas = document.querySelectorAll(".aposta");

  inputsApostas.forEach((input) => {
    input.style.display = ""; // Mostra o input
    input.disabled = true; // Torna o input não editável
    input.style.backgroundColor = "#f0f0f0";
  });
}

async function salvarEstadoVisibilidade(estado) {
  try {
    // 1. Carrega os dados atuais do JSONBin
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      headers: {
        "X-Master-Key": JSONBIN_API_KEY,
      },
    });
    const data = await response.json();
    const dadosAtuais = data.record;

    // 2. Atualiza apenas a chave `placaresOcultos`
    dadosAtuais.placaresOcultos = estado;

    // 3. Salva o objeto completo de volta no JSONBin
    const saveResponse = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": JSONBIN_API_KEY,
      },
      body: JSON.stringify(dadosAtuais),
    });

    const saveData = await saveResponse.json();
    console.log("Estado de visibilidade salvo:", saveData);
  } catch (error) {
    console.error("Erro ao salvar estado de visibilidade:", error);
  }
}

async function carregarEstadoVisibilidade() {
  try {
    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      headers: {
        "X-Master-Key": JSONBIN_API_KEY,
      },
    });
    const data = await response.json();
    const estado = data.record.placaresOcultos || false;
    return estado;
  } catch (error) {
    console.error("Erro ao carregar estado de visibilidade:", error);
    return false;
  }
}
async function verificarEstadoPlacares() {
  const loggedInUser = localStorage.getItem("loggedInUser");
  const toggleButton = document.getElementById("toggle-visibility");
  const toggleText = document.getElementById("toggle-text");

  // Mostrar o botão apenas para o jogador Jardel
  if (loggedInUser === "Jardel") {
    toggleButton.classList.remove("hidden");
    toggleButton.addEventListener("click", toggleVisibility);
  } else {
    toggleButton.classList.add("hidden"); // Oculta o botão para outros usuários
  }

  // Verificar o estado de visibilidade no backend
  const isHidden = await carregarEstadoVisibilidade();
  if (isHidden) {
    ocultarPlacares();
    toggleText.textContent = "Revelar Placar";
  } else {
    mostrarPlacares();
    toggleText.textContent = "Ocultar Placar";
  }
}

        document.getElementById("login-container").classList.remove("hidden");

      }

      // Função para buscar as senhas criptografadas do backend
      async function buscarSenhasCriptografadas() {
        try {
          const response = await fetch("/.netlify/functions/senhas");
          if (!response.ok) {
            throw new Error("Erro ao buscar senhas");
          }
          const data = await response.json();
          return data;
        } catch (error) {
          console.error("Erro na requisição:", error);
          alert("Erro ao buscar senhas. Tente novamente.");
          return {};
        }
      }

      // Função para descriptografar usando o backend
      async function descriptografar(textoCriptografado) {
        try {
          const response = await fetch("/.netlify/functions/descriptografar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ textoCriptografado }),
          });

          if (!response.ok) {
            throw new Error("Erro ao descriptografar");
          }

      function adicionarNavegacaoJogos() {
        const inputsJogos = document.querySelectorAll(".input-jogo");
        inputsJogos.forEach((input, index) => {
          input.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === "Tab") {
              event.preventDefault();
              const nextIndex = index + 1;
              if (nextIndex < inputsJogos.length) {
                inputsJogos[nextIndex].focus();
              }
            }

            // Adiciona a lógica de apagar com Delete ou Backspace
            if (event.key === "Delete" || event.key === "Backspace") {
              event.preventDefault();

              // Se houver texto no campo, remove o último caractere
              if (input.value.length > 0) {
                input.value = input.value.slice(0, -1); // Remove o último caractere
              } else {
                // Se o campo estiver vazio, move o foco para o campo anterior na mesma coluna
                const prevIndex = index - 1;
                if (prevIndex >= 0) {
                  inputsJogos[prevIndex].focus();
                }
                // Se estiver no primeiro campo da coluna, o foco para aqui
              }
            }
          });
        });
      }

      // Função para calcular a pontuação automaticamente ao digitar ou apagar apostas
      function calcularPontuacao() {
    const apostas = obterApostasDaTabela();
    const resultados = obterResultadosDaTabela();
    const jogadores = ["Jardel", "Werbet", "Nailton", "Phillipe"];
    const pontos = { Jardel: 0, Werbet: 0, Nailton: 0, Phillipe: 0 };
    const placaresExatos = { Jardel: 0, Werbet: 0, Nailton: 0, Phillipe: 0 };

    for (let i = 0; i < 10; i++) {
        const resultadoCasa = resultados[i].time1;
        const resultadoFora = resultados[i].time2;

        // Ignora jogos sem resultado
        if (resultadoCasa === "" || resultadoFora === "") continue;

        jogadores.forEach((jogador) => {
            const apostaCasa = apostas[jogador][i].time1;
            const apostaFora = apostas[jogador][i].time2;

            // Ignora apostas em branco
            if (apostaCasa === "" || apostaFora === "") return;

            if (apostaCasa === resultadoCasa && apostaFora === resultadoFora) {
                pontos[jogador] += 3; // Acertou o placar exato
                placaresExatos[jogador] += 1; // Incrementa o contador de placares exatos
            } else if (
                (apostaCasa > apostaFora && resultadoCasa > resultadoFora) ||
                (apostaCasa < apostaFora && resultadoCasa < resultadoFora) ||
                (apostaCasa === apostaFora && resultadoCasa === resultadoFora)
            ) {
                pontos[jogador] += 1; // Acertou o vencedor ou empate
            }
        });
    }

    // Ordena os jogadores por pontuação (do maior para o menor)
    const jogadoresOrdenados = Object.entries(pontos).sort((a, b) => {
        if (b[1] !== a[1]) {
            return b[1] - a[1]; // Ordena por pontuação decrescente
        } else {
            // Em caso de empate, ordena pelo número de placares exatos
            const placaresExatosA = placaresExatos[a[0]];
            const placaresExatosB = placaresExatos[b[0]];
            return placaresExatosB - placaresExatosA;
        }
    });

    // Verifica a pontuação máxima
    const pontuacaoMaxima = jogadoresOrdenados[0][1];

    // Filtra os jogadores com a pontuação máxima
    const vencedores = pontuacaoMaxima > 0
        ? jogadoresOrdenados.filter(([_, pontuacao]) => pontuacao === pontuacaoMaxima)
        : [];

    // Atualiza a exibição da pontuação
    const pontuacaoHTML = jogadoresOrdenados
        .map(([jogador, pontuacao]) => {
            const isVencedor = vencedores.some(([vencedor]) => vencedor === jogador);
            return `<div class="pontuacao-card ${
                isVencedor ? "vencedor" : ""
            }"><h3>${jogador}</h3>
                    <span>
                    <p>${pontuacao} pontos</p></div>`;
        })
        .join("");

    document.getElementById("pontuacao").innerHTML = pontuacaoHTML;
}
