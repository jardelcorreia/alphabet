      // Função debounce para evitar múltiplas chamadas ao servidor
      function debounce(func, wait) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), wait);
        };
      }

      // Função para salvar as apostas com debounce
      const salvarApostasDebounced = debounce(salvarApostas, 500); // 500ms de delay

      // Adiciona eventos de input, change, blur e keydown para salvar automaticamente

        const inputs = document.querySelectorAll(
          ".aposta, .resultado, .input-jogo, #nome-rodada"
        );
        inputs.forEach((input) => {
          input.addEventListener("input", salvarApostasDebounced);
          input.addEventListener("change", salvarApostasDebounced);
          input.addEventListener("blur", salvarApostasDebounced);
          input.addEventListener("keydown", function (event) {
            if (event.key === "Delete" || event.key === "Backspace") {
              salvarApostasDebounced();
            }
          });
        });

      function adicionarNavegacaoJogos() {
        const inputsJogos = document.querySelectorAll(".input-jogo");
        inputsJogos.forEach((input, index) => {
          input.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === "Tab") {
              event.preventDefault();
              const nextIndex = index + 1;
              if (nextIndex < inputsJogos.length) {
                inputsJogos[nextIndex].focus();
              }
            }

            // Adiciona a lógica de apagar com Delete ou Backspace
            if (event.key === "Delete" || event.key === "Backspace") {
              event.preventDefault();

              // Se houver texto no campo, remove o último caractere
              if (input.value.length > 0) {
                input.value = input.value.slice(0, -1); // Remove o último caractere
              } else {
                // Se o campo estiver vazio, move o foco para o campo anterior na mesma coluna
                const prevIndex = index - 1;

                  inputsJogos[prevIndex].focus();
                }

              }
            }

                // Se estiver no primeiro campo da coluna, o foco para aqui
              } else {
                // Limpa o campo atual
                input.value = "";
              }
            }
          });
        });
      }

      function criarLinhasTabela() {
        const tabela = document.getElementById("tabela-apostas");

        for (let i = 1; i <= 10; i++) {
          const linha = document.createElement("tr");
          linha.innerHTML = `
            <td>
                <input type="text" class="input-jogo" placeholder="casa x fora">
            </td>
            ${["Jardel", "Werbet", "Nailton", "Phillipe"]
              .map(
                (jogador, jogadorIndex) => `
                <td>
                    <div class="input-container">
                        <input type="number" class="aposta input-placar jogador${jogadorIndex}" min="0">
                        <span class="placar-separador">x</span>
                        <input type="number" class="aposta input-placar jogador${jogadorIndex}" min="0">
                    </div>
                </td>
            `
              )
              .join("")}
            <td>
                <div class="input-container">
                    <input type="number" class="resultado input-placar" min="0">
                    <span class="placar-separador">x</span>
                    <input type="number" class="resultado input-placar" min="0">
                </div>
            </td>
        `;
          tabela.appendChild(linha);
        }
      }

      function carregarApostas() {
        fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          headers: {
            "X-Master-Key": JSONBIN_API_KEY,
          },
        })
          .then((response) => response.json())
          .then((data) => {
            console.log("Dados carregados:", data); // Verifique os dados carregados
            const { nomeRodada, jogos, apostas, resultados } = data.record;

            // Preenche o nome da rodada
            document.getElementById("nome-rodada").value = nomeRodada || "";

            // Verifica se jogos é um array
            if (!Array.isArray(jogos)) {
              console.error("Erro: jogos não é um array");
              return;
            }

            preencherTabela(jogos, apostas, resultados);
            calcularPontuacao(); // Calcula a pontuação após carregar os dados
          })
          .catch((error) => console.error("Erro ao carregar apostas:", error));
      }

      function salvarApostas() {
        const nomeRodada = document.getElementById("nome-rodada").value;
        const jogos = obterJogosDaTabela();
        console.log("Jogos a serem salvos:", jogos); // Verifique os jogos coletados
        const apostas = obterApostasDaTabela();
        const resultados = obterResultadosDaTabela();

        const dados = { nomeRodada, jogos, apostas, resultados };

        fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": JSONBIN_API_KEY,
          },
          body: JSON.stringify(dados),
        })
          .then((response) => response.json())
          .then((data) => console.log("Dados salvos com sucesso:", data))
          .catch((error) => console.error("Erro ao salvar dados:", error));
      }

      function preencherTabela(jogos, apostas, resultados) {
        console.log("Preenchendo tabela com jogos:", jogos); // Verifique os jogos recebidos
        const inputsJogos = document.querySelectorAll(".input-jogo");
        const inputsApostas = document.querySelectorAll(".aposta");
        const inputsResultados = document.querySelectorAll(".resultado");

        // Preenche os nomes dos times
        inputsJogos.forEach((input, index) => {
          input.value = jogos[index] || "";
        });

        // Preenche as apostas dos jogadores
        const jogadores = ["Jardel", "Werbet", "Nailton", "Phillipe"];
        jogadores.forEach((jogador, jogadorIndex) => {
          for (let i = 0; i < 10; i++) {
            const indexCasa = i * 8 + jogadorIndex * 2; // Índice do time1
            const indexFora = indexCasa + 1; // Índice do time2
            inputsApostas[indexCasa].value = apostas[jogador][i].time1 || "";
            inputsApostas[indexFora].value = apostas[jogador][i].time2 || "";
          }
        });

        // Preenche os resultados
        for (let i = 0; i < 10; i++) {
          inputsResultados[i * 2].value = resultados[i].time1 || "";
          inputsResultados[i * 2 + 1].value = resultados[i].time2 || "";
        }
      }

      function obterJogosDaTabela() {
        const jogos = [];
        const inputs = document.querySelectorAll(".input-jogo");
        inputs.forEach((input) => jogos.push(input.value));
        return jogos;
      }

      function obterApostasDaTabela() {
        const apostas = { Jardel: [], Werbet: [], Nailton: [], Phillipe: [] };
        const inputs = document.querySelectorAll(".aposta");

        for (let i = 0; i < 10; i++) {
          apostas.Jardel.push({
            time1: inputs[i * 8].value,
            time2: inputs[i * 8 + 1].value,
          });
          apostas.Werbet.push({
            time1: inputs[i * 8 + 2].value,
            time2: inputs[i * 8 + 3].value,
          });
          apostas.Nailton.push({
            time1: inputs[i * 8 + 4].value,
            time2: inputs[i * 8 + 5].value,
          });
          apostas.Phillipe.push({
            time1: inputs[i * 8 + 6].value,
            time2: inputs[i * 8 + 7].value,
          });
        }

        return apostas;
      }

      function obterResultadosDaTabela() {
        const resultados = [];
        const inputs = document.querySelectorAll(".resultado");

        for (let i = 0; i < 10; i++) {
          resultados.push({
            time1: inputs[i * 2].value,
            time2: inputs[i * 2 + 1].value,
          });
        }

        return resultados;
      }

      // Função para calcular a pontuação automaticamente ao digitar ou apagar apostas
      function calcularPontuacao() {
        const apostas = obterApostasDaTabela();
        const resultados = obterResultadosDaTabela();
        const jogadores = ["Jardel", "Werbet", "Nailton", "Phillipe"];
        const pontos = { Jardel: 0, Werbet: 0, Nailton: 0, Phillipe: 0 };

        for (let i = 0; i < 10; i++) {
          const resultadoCasa = resultados[i].time1;
          const resultadoFora = resultados[i].time2;

          // Ignora jogos sem resultado
          if (resultadoCasa === "" || resultadoFora === "") continue;

          jogadores.forEach((jogador) => {
            const apostaCasa = apostas[jogador][i].time1;
            const apostaFora = apostas[jogador][i].time2;

            // Ignora apostas em branco
            if (apostaCasa === "" || apostaFora === "") return;

            if (apostaCasa === resultadoCasa && apostaFora === resultadoFora) {
              pontos[jogador] += 3; // Acertou o placar exato
            } else if (
              (apostaCasa > apostaFora && resultadoCasa > resultadoFora) ||
              (apostaCasa < apostaFora && resultadoCasa < resultadoFora) ||
              (apostaCasa === apostaFora && resultadoCasa === resultadoFora)
            ) {
              pontos[jogador] += 1; // Acertou o vencedor ou empate
            }
          });
        }

        // Ordena os jogadores por pontuação (do maior para o menor)
        const jogadoresOrdenados = Object.entries(pontos).sort((a, b) => {
          if (b[1] !== a[1]) {
            return b[1] - a[1]; // Ordena por pontuação decrescente
          } else {
            return a[0].localeCompare(b[0]); // Em caso de empate, ordena alfabeticamente
          }
        });

        // Verifica se há um único vencedor (sem empate)
        const [primeiroJogador, primeiraPontuacao] = jogadoresOrdenados[0];
        const [segundoJogador, segundaPontuacao] = jogadoresOrdenados[1];

        const haEmpate = primeiraPontuacao === segundaPontuacao;

        // Atualiza a exibição da pontuação
        const pontuacaoHTML = jogadoresOrdenados
          .map(([jogador, pontuacao]) => {
            const isVencedor = !haEmpate && jogador === primeiroJogador;
            return `<div class="pontuacao-card ${
              isVencedor ? "vencedor" : ""
            }"><h3>${jogador}</h3>
                    <span>
                    <p>${pontuacao} pontos</p></div>`;
          })
          .join("");

        document.getElementById("pontuacao").innerHTML = pontuacaoHTML;
      }

      // Adiciona eventos de input e keydown para recalcular a pontuação ao digitar ou apagar apostas
      function adicionarEventosCalculoPontuacao() {
        // Adiciona eventos aos campos de apostas
        const inputsApostas = document.querySelectorAll(".aposta");
        inputsApostas.forEach((input) => {
          input.addEventListener("input", function () {
            salvarApostasDebounced(); // Salva as apostas automaticamente
            calcularPontuacao(); // Recalcula a pontuação
          });

          input.addEventListener("keydown", function (event) {
            if (event.key === "Delete" || event.key === "Backspace") {
              salvarApostasDebounced(); // Salva as apostas automaticamente
              calcularPontuacao(); // Recalcula a pontuação
            }
          });
        });

        // Adiciona eventos aos campos de resultado
        const inputsResultados = document.querySelectorAll(".resultado");
        inputsResultados.forEach((input) => {
          input.addEventListener("input", function () {
            salvarApostasDebounced(); // Salva as apostas automaticamente
            calcularPontuacao(); // Recalcula a pontuação
          });

          input.addEventListener("keydown", function (event) {
            if (event.key === "Delete" || event.key === "Backspace") {
              salvarApostasDebounced(); // Salva as apostas automaticamente
              calcularPontuacao(); // Recalcula a pontuação
            }
          });
        });
      }

      function limparApostas() {
        document
          .querySelectorAll("input")
          .forEach((input) => (input.value = ""));
        document.getElementById("pontuacao").innerHTML = "";
      }
    </script>
