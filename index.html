      function handleKeyPress(event) {

      // Função debounce para evitar múltiplas chamadas ao servidor
      function debounce(func, wait) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), wait);
        };
      }

      // Função para salvar as apostas com debounce
      const salvarApostasDebounced = debounce(salvarApostas, 500); // 500ms de delay

      // Adiciona eventos de input, change, blur e keydown para salvar automaticamente
      function adicionarEventosSalvamento() {
        const inputs = document.querySelectorAll(
          ".aposta, .resultado, .input-jogo, #nome-rodada"
        );
        inputs.forEach((input) => {
          input.addEventListener("input", salvarApostasDebounced);
          input.addEventListener("change", salvarApostasDebounced);
          input.addEventListener("blur", salvarApostasDebounced);
          input.addEventListener("keydown", function (event) {
            if (event.key === "Delete" || event.key === "Backspace") {
              salvarApostasDebounced();
            }
          });
        });
      }

// Função para salvar o estado de visibilidade no Supabase
  async function salvarEstadoVisibilidade(estado) {
    try {
      // Busca o registro atual
      const { data, error: fetchError } = await supabaseClient
        .from('alphabet_table')
        .select('*')
        .order('id', { ascending: false })
        .limit(1);
      
      if (fetchError) throw fetchError;
      
      // Se não existe registro, cria um novo
      if (!data || data.length === 0) {
        const { error: insertError } = await supabaseClient
          .from('alphabet_table')
          .insert({
            nome_rodada: '',
            jogos: [],
            apostas: { Jardel: [], Werbet: [], Nailton: [], Phillipe: [] },
            resultados: [],
            placares_ocultos: estado,
            ranking: {},
            vitorias_empates: {}
          });
        
        if (insertError) throw insertError;
      } else {
        // Atualiza o registro existente
        const { error: updateError } = await supabaseClient
          .from('alphabet_table')
          .update({ placares_ocultos: estado })
          .eq('id', data[0].id);
        
        if (updateError) throw updateError;
      }
      
      console.log("Estado de visibilidade salvo com sucesso");
    } catch (error) {
      console.error("Erro ao salvar estado de visibilidade:", error);
    }
  }
      
async function carregarEstadoVisibilidade() {
    try {
      const { data, error } = await supabaseClient
        .from('alphabet_table')
        .select('placares_ocultos')
        .order('id', { ascending: false })
        .limit(1);
      
      if (error) throw error;
      
      return data && data.length > 0 ? data[0].placares_ocultos : false;
    } catch (error) {
      console.error("Erro ao carregar estado de visibilidade:", error);
      return false;
    }
}

      function adicionarNavegacaoJogos() {
        const inputsJogos = document.querySelectorAll(".input-jogo");
        inputsJogos.forEach((input, index) => {
          input.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === "Tab") {
              event.preventDefault();
              const nextIndex = index + 1;
              if (nextIndex < inputsJogos.length) {
                inputsJogos[nextIndex].focus();
              }
            }

            // Adiciona a lógica de apagar com Delete ou Backspace
            if (event.key === "Delete" || event.key === "Backspace") {
              event.preventDefault();

              // Se houver texto no campo, remove o último caractere
              if (input.value.length > 0) {
                input.value = input.value.slice(0, -1); // Remove o último caractere
              } else {
                // Se o campo estiver vazio, move o foco para o campo anterior na mesma coluna
                const prevIndex = index - 1;
                if (prevIndex >= 0) {
                  inputsJogos[prevIndex].focus();
                }
                // Se estiver no primeiro campo da coluna, o foco para aqui
              }
            }
          });
        });
      }

      // Função para calcular a pontuação automaticamente ao digitar ou apagar apostas
      function calcularPontuacao() {
    const apostas = obterApostasDaTabela();
    const resultados = obterResultadosDaTabela();
    const jogadores = ["Jardel", "Werbet", "Nailton", "Phillipe"];
    const pontos = { Jardel: 0, Werbet: 0, Nailton: 0, Phillipe: 0 };
    const placaresExatos = { Jardel: 0, Werbet: 0, Nailton: 0, Phillipe: 0 };

    for (let i = 0; i < 10; i++) {
        const resultadoCasa = resultados[i].time1;
        const resultadoFora = resultados[i].time2;

        // Ignora jogos sem resultado
        if (resultadoCasa === "" || resultadoFora === "") continue;

        jogadores.forEach((jogador) => {
            const apostaCasa = apostas[jogador][i].time1;
            const apostaFora = apostas[jogador][i].time2;

            // Ignora apostas em branco
            if (apostaCasa === "" || apostaFora === "") return;

            if (apostaCasa === resultadoCasa && apostaFora === resultadoFora) {
                pontos[jogador] += 3; // Acertou o placar exato
                placaresExatos[jogador] += 1; // Incrementa o contador de placares exatos
            } else if (
                (apostaCasa > apostaFora && resultadoCasa > resultadoFora) ||
                (apostaCasa < apostaFora && resultadoCasa < resultadoFora) ||
                (apostaCasa === apostaFora && resultadoCasa === resultadoFora)
            ) {
                pontos[jogador] += 1; // Acertou o vencedor ou empate
            }
        });
    }

    // Ordena os jogadores por pontuação (do maior para o menor)
    const jogadoresOrdenados = Object.entries(pontos).sort((a, b) => {
        if (b[1] !== a[1]) {
            return b[1] - a[1]; // Ordena por pontuação decrescente
        } else {
            // Em caso de empate, ordena pelo número de placares exatos
            const placaresExatosA = placaresExatos[a[0]];
            const placaresExatosB = placaresExatos[b[0]];
            return placaresExatosB - placaresExatosA;
        }
    });

    // Verifica a pontuação máxima
    const pontuacaoMaxima = jogadoresOrdenados[0][1];

    // Filtra os jogadores com a pontuação máxima
    const vencedores = pontuacaoMaxima > 0
        ? jogadoresOrdenados.filter(([_, pontuacao]) => pontuacao === pontuacaoMaxima)
        : [];

    // Atualiza a exibição da pontuação
    const pontuacaoHTML = jogadoresOrdenados
        .map(([jogador, pontuacao]) => {
            const isVencedor = vencedores.some(([vencedor]) => vencedor === jogador);
            return `<div class="pontuacao-card ${
                isVencedor ? "vencedor" : ""
            }"><h3>${jogador}</h3>
                    <span>
                    <p>${pontuacao} pontos</p></div>`;
        })
        .join("");

    document.getElementById("pontuacao").innerHTML = pontuacaoHTML;
}

    'CANCELED': 'Cancelado'
  };
  return statusMap[status] || status;
}

// Função para definir classe CSS com base no status
function statusClass(status) {
  if (status === 'FINISHED') return 'status-FINISHED';
  if (status === 'IN_PLAY' || status === 'PAUSED') return 'status-LIVE';
  return 'status-SCHEDULED';
}

async function buscarCalendario() {
  const url = "/.netlify/functions/fetchMatches"; // Endpoint da API via Netlify Function

  try {
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`Erro de rede: ${response.status}`);
    }

    const data = await response.json();
    console.log("Dados recebidos:", data);

    // Atualiza as variáveis globais
    todasPartidas = data.matches;

    // Agrupa as partidas por rodada
    partidasPorRodada = {}; // Reinicializa o objeto
    todasPartidas.forEach(partida => {
      const rodada = partida.matchday;
      if (!partidasPorRodada[rodada]) {
        partidasPorRodada[rodada] = [];
      }
      partidasPorRodada[rodada].push(partida);
    });

    console.log("Partidas por rodada:", partidasPorRodada); // Verifica o agrupamento

    // Ordena as rodadas por data de início
    const rodadasOrdenadas = Object.keys(partidasPorRodada)
      .map(rodada => ({
        rodada: parseInt(rodada),
        dataInicio: new Date(partidasPorRodada[rodada][0].utcDate), // Data do primeiro jogo da rodada
        dataFim: new Date(partidasPorRodada[rodada][partidasPorRodada[rodada].length - 1].utcDate) // Data do último jogo da rodada
      }))
      .sort((a, b) => a.dataInicio - b.dataInicio);

    console.log("Rodadas ordenadas:", rodadasOrdenadas); // Verifica a ordenação

    // Determina a rodada atual com base na data atual
    const dataAtual = new Date();
    rodadaAtual = 1; // Inicializa com a primeira rodada

    for (const rodada of rodadasOrdenadas) {
      if (dataAtual >= rodada.dataInicio && dataAtual <= rodada.dataFim) {
        rodadaAtual = rodada.rodada;
        break;
      } else if (dataAtual > rodada.dataFim) {
        rodadaAtual = rodada.rodada; // Atualiza para a última rodada concluída
      }
    }

    // Define o total de rodadas
    totalRodadas = rodadasOrdenadas.length;

    console.log("Rodada atual:", rodadaAtual); // Verifica a rodada atual
    console.log("Total de rodadas:", totalRodadas); // Verifica o total de rodadas

    // Exibe a rodada atual
    exibirRodada(rodadaAtual, partidasPorRodada[rodadaAtual]);

    // Atualiza a navegação
    atualizarNavegacao();

  } catch (error) {
    console.error("Erro ao buscar dados:", error);
    document.getElementById("calendario-jogos").innerHTML = `
      <div class="error">
        <p><strong>Erro ao carregar os dados:</strong> ${error.message}</p>
        <p>Por favor, tente novamente mais tarde ou verifique sua conexão com a internet.</p>
      </div>
    `;
  }
}

    // Atualiza a navegação
    document.getElementById("anterior").addEventListener("click", () => {
  if (rodadaAtual > 1) {
    rodadaAtual--;
    exibirRodada(rodadaAtual, partidasPorRodada[rodadaAtual]);
    atualizarNavegacao();
  }
});

document.getElementById("proxima").addEventListener("click", () => {
  console.log("Rodada atual antes:", rodadaAtual); // Verifica o valor atual
  if (rodadaAtual < totalRodadas) {
    rodadaAtual++;
    console.log("Rodada atual depois:", rodadaAtual); // Verifica o valor após incrementar
    exibirRodada(rodadaAtual, partidasPorRodada[rodadaAtual]);
    atualizarNavegacao();
  } else {
    console.log("Não há mais rodadas para exibir.");
  }
});
      
function exibirRodada(rodada, partidas) {
  const calendario = document.getElementById("calendario-jogos");
  calendario.innerHTML = ""; // Limpa o conteúdo anterior

  if (!partidas || partidas.length === 0) {
    calendario.innerHTML = `
      <div style="text-align: center; grid-column: 1 / -1; padding: 30px;">
        <p>Nenhum jogo encontrado para esta rodada.</p>
      </div>
    `;
    return;
  }

  partidas.forEach(partida => {
    const timeCasaInfo = timesInfo[partida.homeTeam.name] || { 
      abrev: partida.homeTeam.name.substring(0, 3).toUpperCase(), 
      nome: partida.homeTeam.name,
      escudo: "https://logodetimes.com/imagens/generico-256.png"
    };
    
    const timeForaInfo = timesInfo[partida.awayTeam.name] || { 
      abrev: partida.awayTeam.name.substring(0, 3).toUpperCase(), 
      nome: partida.awayTeam.name,
      escudo: "https://logodetimes.com/imagens/generico-256.png"
    };
    
    const temPlacar = partida.score.fullTime.home !== null;
    const statusTexto = traduzirStatus(partida.status);
    const statusClasse = statusClass(partida.status);

    const jogoHTML = `
      <div class="jogo">
        <div class="jogo-header">
          <div class="jogo-data">${formatarData(partida.utcDate)}</div>
        </div>
        
        <div class="jogo-times">
          <div class="time">
            <img src="${timeCasaInfo.escudo}" alt="${timeCasaInfo.nome}" class="time-escudo" onerror="handleImageError(this)">
            <div class="time-abrev">${timeCasaInfo.abrev}</div>
            <div class="time-nome">${timeCasaInfo.nome}</div>
          </div>
          <div class="versus">X</div>
          <div class="time">
            <img src="${timeForaInfo.escudo}" alt="${timeForaInfo.nome}" class="time-escudo" onerror="handleImageError(this)">
            <div class="time-abrev">${timeForaInfo.abrev}</div>
            <div class="time-nome">${timeForaInfo.nome}</div>
          </div>
        </div>
        
        ${temPlacar ? `
          <div class="placar">
            <span>${partida.score.fullTime.home}</span>
            <span class="placar-separator">:</span>
            <span>${partida.score.fullTime.away}</span>
          </div>
        ` : ''}
        
        <div class="jogo-footer">
          <div class="status ${statusClasse}">${statusTexto}</div>
          <div class="horario">${formatarHora(partida.utcDate)}</div>
        </div>
      </div>
    `;
    calendario.innerHTML += jogoHTML;
  });
}

function atualizarNavegacao() {
  // Atualiza o texto que exibe a rodada atual
  document.getElementById("rodada-atual").textContent = `Rodada ${rodadaAtual} de ${totalRodadas}`;

  // Desabilita o botão "Anterior" se estiver na primeira rodada
  document.getElementById("anterior").disabled = rodadaAtual === 1;

  // Desabilita o botão "Próxima" se estiver na última rodada
  document.getElementById("proxima").disabled = rodadaAtual === totalRodadas;
}

// Dados da tabela principal
let dadosTabelaPrincipal = {
  nomeRodada: "",
  jogos: [],
  resultados: []
};

async function preencherTabelaPrincipalComRodadaAtual(rodada) {
  // Verifica se a rodada que está sendo carregada é a mesma que já está sendo exibida
  if (rodadaExibida !== null && rodadaExibida !== rodada) {
    const confirmacao = confirm(`A tabela principal já está preenchida com a Rodada ${rodadaExibida}. Deseja substituir pela Rodada ${rodada}?`);
    if (!confirmacao) {
      console.log("Preenchimento cancelado pelo usuário.");
      return; // Cancela o preenchimento se o usuário não confirmar
    }
  }

  const url = "/.netlify/functions/fetchMatches"; // Endpoint da API via Netlify Function

  try {
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`Erro de rede: ${response.status}`);
    }

    const data = await response.json();

    // Filtra os jogos da rodada atual
    const jogosRodadaAtual = data.matches.filter(partida => partida.matchday === rodada);

    if (jogosRodadaAtual.length === 0) {
      console.log(`Nenhum jogo encontrado para a rodada ${rodada}.`);
      return;
    }

    // Atualiza os dados da tabela principal
    dadosTabelaPrincipal.nomeRodada = `Rodada ${rodada}`;
    dadosTabelaPrincipal.jogos = jogosRodadaAtual.map(partida => ({
      casa: partida.homeTeam.name,
      fora: partida.awayTeam.name
    }));

    // Preenche os resultados reais (se disponíveis)
    dadosTabelaPrincipal.resultados = jogosRodadaAtual.map(partida => ({
      casa: partida.score.fullTime.home || "", // Usa o resultado real ou vazio se não houver
      fora: partida.score.fullTime.away || ""  // Usa o resultado real ou vazio se não houver
    }));

    // Preenche a tabela principal
    preencherTabelaPrincipalHTML();

    // Atualiza a variável global com a rodada exibida
    rodadaExibida = rodada;

    // Força o salvamento dos dados após preencher a tabela
    await salvarApostas();

  } catch (error) {
    console.error("Erro ao buscar dados da tabela principal:", error);
    alert("Erro ao carregar os dados da tabela principal. Tente novamente.");
  }
}

// Atualização periódica (1 hora)
let intervaloAtualizacao;

function iniciarAtualizacaoAutomatica() {
  intervaloAtualizacao = setInterval(() => {
    preencherTabelaPrincipalComRodadaAtual(rodadaAtual); // Passa a rodada atual como parâmetro
  }, 3600000); // 3.600.000 ms = 1 hora
}

function pararAtualizacaoAutomatica() {
  clearInterval(intervaloAtualizacao);
}

// Adicionar evento ao botão para iniciar/parar a atualização automática
document.getElementById("preencher-tabela-principal").addEventListener("click", () => {
