<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking - AlphaBet 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <h1 class="animate__animated animate__fadeInDown">Ranking AlphaBet 2026</h1>
        <p class="animate__animated animate__fadeInUp animate__delay-1s">
            Lista de vencedores de cada rodada e placar do campeonato.
        </p>
    </div>

    <div class="main-container">
        <!-- Coluna 1: Inputs de ranking -->
        <div class="card animate__animated animate__fadeInLeft">
            <div class="card-header">
                <h2><i class="fas fa-trophy"></i> Vencedores por Rodada</h2>
            </div>
            <div class="card-body">
                <div id="inputs-ranking"></div>
            </div>
        </div>

        <!-- Coluna 2: Seção de vitórias -->
        <div class="card animate__animated animate__fadeInRight">
            <div class="card-header">
                <h2><i class="fas fa-medal"></i> Placar do Campeonato</h2>
            </div>
            <div class="card-body">
                <div id="vitorias" class="score-cards"></div>
            </div>
        </div>
    </div>

    <!-- Seção de Classificação do Campeonato -->
    <div class="classification-card animate__animated animate__fadeInUp">
        <h2 class="classification-title">Classificação do Campeonato</h2>
        <div class="classification-tabs">
            <button class="tab-button active" data-tab="geral">Geral</button>
            <button class="tab-button" data-tab="turno1">1º Turno</button>
            <button class="tab-button" data-tab="turno2">2º Turno</button>
        </div>
        <div class="classification-table-container">
            <div class="loader"></div>
            <table class="classification-table">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Clube</th>
                        <th>Pts</th>
                        <th>PJ</th>
                        <th>VIT</th>
                        <th>E</th>
                        <th>DER</th>
                        <th>GP</th>
                        <th>GC</th>
                        <th>SG</th>
                    </tr>
                </thead>
                <tbody id="classification-body">
                    <!-- Linhas da tabela serão inseridas aqui -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="saved-indicator" id="saved-indicator">
        <i class="fas fa-check-circle"></i>
        <span>Dados salvos com sucesso!</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuração do Supabase
        const SUPABASE_URL = "https://leuyfasvbfwdaloapmrs.supabase.co";
        const SUPABASE_KEY =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxldXlmYXN2YmZ3ZGFsb2FwbXJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDExMTczMzUsImV4cCI6MjA1NjY5MzMzNX0.Y_s-KMy9n_Ht2OVaxmQEjnDRniqJ_DcppQVam7uAGk4";

        // Inicialização do cliente Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const configCampeonato = {
            valorRodadaAtual: 6,
            valoresRodada: {},
        };
        const jogadores = ["Jardel", "Werbet", "Nailton", "Phillipe"];

        // Função debounce para otimizar chamadas
        function debounce(func, wait) {
            let timeout;
            return function () {
                const context = this;
                const args = arguments;
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    func.apply(context, args);
                }, wait);
            };
        }

        function criarInputsRanking() {
            const inputsRanking = document.getElementById("inputs-ranking");

            for (let i = 1; i <= 38; i++) {
                const container = document.createElement("div");
                container.className = "input-container";
                container.dataset.rodada = i;

                // Rótulo da rodada
                const label = document.createElement("div");
                label.textContent = `${i}`;
                label.className = "rodada-label";

                // Valor da rodada
                const valorDiv = document.createElement("div");
                valorDiv.className = "valor-container";

                const valorInput = document.createElement("input");
                valorInput.type = "number";
                valorInput.className = "valor-rodada-input";
                valorInput.min = "1";
                valorInput.step = "1";
                valorInput.value =
                    configCampeonato.valoresRodada[i] ||
                    configCampeonato.valorRodadaAtual ||
                    6;
                valorInput.id = `valor-rodada-${i}`;

                valorDiv.innerHTML = `<span class="currency-prefix">R$</span>`;
                valorDiv.appendChild(valorInput);

                // Campo do vencedor
                const winnerInput = document.createElement("input");
                winnerInput.type = "text";
                winnerInput.placeholder = `Vencedor da Rodada ${i}`;
                winnerInput.id = `rodada-${i}`;
                winnerInput.className = "winner-input";

                // Montagem
                container.appendChild(label);
                container.appendChild(valorDiv);
                container.appendChild(winnerInput);
                inputsRanking.appendChild(container);

                // Event listeners com debounce
                winnerInput.addEventListener(
                    "input",
                    debounce(() => {
                        if (validarInput(winnerInput.value, i)) {
                            salvarRanking();
                        }
                    }, 1000)
                );

                valorInput.addEventListener(
                    "input",
                    debounce(() => {
                        const novoValor = parseFloat(valorInput.value);
                        if (!isNaN(novoValor) && novoValor > 0) {
                            configCampeonato.valoresRodada[i] = novoValor;
                            salvarRanking();
                        }
                    }, 1000)
                );
            }
        }

        function validarInput(valor, rodada) {
            if (valor.includes(",") && !valor.includes(", ")) {
                alert(
                    `Rodada ${rodada}: Utilize vírgula + espaço entre os nomes no empate. Ex: Jardel, Werbet`
                );
                return false;
            }

            const nomes = valor
                .split(",")
                .map((n) => n.trim())
                .filter((n) => n !== "");

            for (let nome of nomes) {
                if (!jogadores.includes(nome)) {
                    alert(
                        `Rodada ${rodada}: Nome "${nome}" inválido! Use apenas: ${jogadores.join(
                            ", "
                        )}`
                    );
                    return false;
                }
                if (nome[0] !== nome[0]?.toUpperCase()) {
                    alert(
                        `Rodada ${rodada}: Nome "${nome}" deve começar com letra maiúscula!`
                    );
                    return false;
                }
            }
            return true;
        }

        async function carregarRanking() {
            try {
                const { data, error } = await supabaseClient
                    .from("alphabet_table")
                    .select("*")
                    .order("id", { ascending: false })
                    .limit(1);

                if (error) throw error;

                if (!data || data.length === 0) return;

                const dadosAtuais = data[0];

                if (dadosAtuais.configuracao) {
                    configCampeonato.valorRodadaAtual =
                        dadosAtuais.configuracao.valorRodadaAtual || 6;
                    configCampeonato.valoresRodada =
                        dadosAtuais.configuracao.valoresRodada || {};
                }

                if (dadosAtuais.ranking) {
                    dadosAtuais.ranking.forEach((vencedores, index) => {
                        const input = document.getElementById(`rodada-${index + 1}`);
                        if (input) {
                            input.value = vencedores || "";
                        }

                        const valorInput = document.getElementById(
                            `valor-rodada-${index + 1}`
                        );
                        if (valorInput) {
                            valorInput.value =
                                configCampeonato.valoresRodada[index + 1] ||
                                configCampeonato.valorRodadaAtual ||
                                6;
                        }
                    });
                }

                const historicoPontuacao = dadosAtuais.historico_pontuacao || {};

                exibirVitorias(
                    dadosAtuais.vitorias_empates ||
                    calcularVitoriasEmpatesSaldo(
                        dadosAtuais.ranking || [],
                        configCampeonato.valoresRodada,
                        configCampeonato.valorRodadaAtual
                    ),
                    historicoPontuacao
                );
            } catch (error) {
                console.error("Erro ao carregar ranking:", error);
            }
        }

        function calcularVitoriasEmpatesSaldo(ranking) {
            const vitoriasEmpates = {
                Jardel: { vitorias: 0, empates: 0, saldo: 0 },
                Werbet: { vitorias: 0, empates: 0, saldo: 0 },
                Nailton: { vitorias: 0, empates: 0, saldo: 0 },
                Phillipe: { vitorias: 0, empates: 0, saldo: 0 },
            };

            const jogadores = Object.keys(vitoriasEmpates);

            ranking.forEach((vencedores, rodadaIndex) => {
                if (!vencedores.trim()) return;

                const numeroRodada = rodadaIndex + 1;
                const valorRodada =
                    configCampeonato.valoresRodada[numeroRodada] ||
                    configCampeonato.valorRodadaAtual;

                const listaVencedores = vencedores
                    .split(",")
                    .map((nome) => nome.trim())
                    .filter((nome) => nome !== "");

                if (listaVencedores.length === 0) return;

                if (listaVencedores.length === 1) {
                    const vencedor = listaVencedores[0];
                    if (vitoriasEmpates[vencedor]) {
                        vitoriasEmpates[vencedor].vitorias++;
                        vitoriasEmpates[vencedor].saldo +=
                            valorRodada * (jogadores.length - 1);

                        jogadores.forEach((jogador) => {
                            if (jogador !== vencedor) {
                                vitoriasEmpates[jogador].saldo -= valorRodada;
                            }
                        });
                    }
                } else {
                    listaVencedores.forEach((vencedor) => {
                        if (vitoriasEmpates[vencedor]) {
                            vitoriasEmpates[vencedor].empates++;
                        }
                    });

                    const perdedores = jogadores.filter(
                        (j) => !listaVencedores.includes(j)
                    );

                    if (listaVencedores.length === 2) {
                        const valorPorPerdedor = valorRodada / 2;
                        listaVencedores.forEach((vencedor) => {
                            vitoriasEmpates[vencedor].saldo +=
                                valorPorPerdedor * perdedores.length;
                        });
                        perdedores.forEach((perdedor) => {
                            vitoriasEmpates[perdedor].saldo -= valorRodada;
                        });
                    } else if (listaVencedores.length === 3) {
                        const valorPorPerdedor = valorRodada / 3;
                        listaVencedores.forEach((vencedor) => {
                            vitoriasEmpates[vencedor].saldo +=
                                valorPorPerdedor * perdedores.length;
                        });
                        perdedores.forEach((perdedor) => {
                            vitoriasEmpates[perdedor].saldo -= valorRodada;
                        });
                    }
                }
            });

            return vitoriasEmpates;
        }

        async function salvarRanking() {
            const ranking = [];
            const valoresRodadas = configCampeonato.valoresRodada || {};

            for (let i = 1; i <= 38; i++) {
                const input = document.getElementById(`rodada-${i}`);
                ranking.push(input ? input.value.trim() : "");

                const valorInput = document.getElementById(`valor-rodada-${i}`);
                if (valorInput && valorInput.value) {
                    valoresRodadas[i] = parseFloat(valorInput.value);
                }
            }

            try {
                const { data: ultimoRegistro, error: fetchError } =
                    await supabaseClient
                        .from("alphabet_table")
                        .select("id")
                        .order("id", { ascending: false })
                        .limit(1)
                        .single();

                if (fetchError && fetchError.code !== "PGRST116") throw fetchError;

                const dadosParaSalvar = {
                    ranking: ranking,
                    vitorias_empates: calcularVitoriasEmpatesSaldo(
                        ranking,
                        valoresRodadas, // This is configCampeonato.valoresRodada
                        configCampeonato.valorRodadaAtual
                    ),
                    configuracao: {
                        valoresRodada: valoresRodadas,
                        valorRodadaAtual: configCampeonato.valorRodadaAtual,
                    },
                };

                if (ultimoRegistro) {
                    const { error: updateError } = await supabaseClient
                        .from("alphabet_table")
                        .update(dadosParaSalvar)
                        .eq("id", ultimoRegistro.id);

                    if (updateError) throw updateError;
                } else {
                    const { error: insertError } = await supabaseClient
                        .from("alphabet_table")
                        .insert(dadosParaSalvar);

                    if (insertError) throw insertError;
                }

                mostrarIndicadorSalvo();
                exibirVitorias(calcularVitoriasEmpatesSaldo(ranking));
                carregarRanking();
            } catch (error) {
                console.error("Erro ao salvar ranking:", error);
                alert("Erro ao salvar. Verifique sua conexão.");
            }
        }

        function mostrarIndicadorSalvo() {
            const indicador = document.getElementById("saved-indicator");
            indicador.classList.add("show");
            setTimeout(() => indicador.classList.remove("show"), 3000);
        }

        function exibirVitorias(resultados, historicoPontuacao) {
            const vitoriasContainer = document.getElementById("vitorias");
            vitoriasContainer.innerHTML = "";

            // Calcula o total de pontos para cada jogador baseado no histórico
            const pontosTotais = {};

            // Inicializa com os jogadores do ranking atual para garantir que todos apareçam
            Object.keys(resultados).forEach(jogador => {
                pontosTotais[jogador] = 0;
            });

            if (historicoPontuacao) {
                Object.values(historicoPontuacao).forEach(rodada => {
                    Object.entries(rodada).forEach(([jogador, pontos]) => {
                        if (!pontosTotais[jogador]) pontosTotais[jogador] = 0;
                        pontosTotais[jogador] += pontos;
                    });
                });
            }

            const resultadosOrdenados = Object.entries(resultados).sort((a, b) => {
                const pontosTotalA = pontosTotais[a[0]] || 0;
                const pontosTotalB = pontosTotais[b[0]] || 0;

                // Critério 1: Número de Vitórias
                if (b[1].vitorias !== a[1].vitorias)
                    return b[1].vitorias - a[1].vitorias;

                // Critério 2: Número de Empates
                if (b[1].empates !== a[1].empates) return b[1].empates - a[1].empates;

                // Critério 3: Total de Pontos
                if (pontosTotalB !== pontosTotalA) return pontosTotalB - pontosTotalA;

                return a[0].localeCompare(b[0]);
            });

            resultadosOrdenados.forEach(
                ([jogador, { vitorias, empates, saldo }], index) => {
                    // Usa o total calculado do histórico ou 0 se não houver
                    const pontos = pontosTotais[jogador] || 0;

                    const card = document.createElement("div");
                    card.className = "player-card";
                    if (index < 3) card.classList.add(`position-${index + 1}`);
                    if (index === 0) card.classList.add("pulse");

                    const posicao = document.createElement("div");
                    posicao.className = `player-position ${index < 3 ? "position-" + (index + 1) : ""
                        }`;
                    posicao.textContent = index + 1;

                    const nome = document.createElement("h3");
                    nome.className = "player-name";
                    nome.textContent = jogador;

                    const statsContainer = document.createElement("div");
                    statsContainer.className = "stats-container";

                    const statVitorias = document.createElement("div");
                    statVitorias.className = "stat";
                    statVitorias.innerHTML = `<span class="stat-value">${vitorias}</span><span class="stat-label">Vitórias</span>`;

                    const statEmpates = document.createElement("div");
                    statEmpates.className = "stat";
                    statEmpates.innerHTML = `<span class="stat-value">${empates}</span><span class="stat-label">Empates</span>`;

                    const statPontos = document.createElement("div");
                    statPontos.className = "stat";
                    statPontos.innerHTML = `<span class="stat-value">${pontos}</span><span class="stat-label">Pontos</span>`;

                    const statSaldo = document.createElement("div");
                    statSaldo.className = "stat";
                    statSaldo.innerHTML = `<span class="stat-value ${saldo >= 0 ? "text-success" : "text-danger"
                        }">R$${saldo.toFixed(
                            2
                        )}</span><span class="stat-label">Saldo</span>`;

                    statsContainer.appendChild(statVitorias);
                    statsContainer.appendChild(statEmpates);
                    statsContainer.appendChild(statPontos);
                    statsContainer.appendChild(statSaldo);

                    card.appendChild(posicao);
                    card.appendChild(nome);
                    card.appendChild(statsContainer);
                    vitoriasContainer.appendChild(card);

                    setTimeout(() => {
                        card.style.opacity = "1";
                        card.style.transform = "translateY(0)";
                    }, index * 150);
                }
            );
        }

        // --- Classificação do Campeonato ---
        const classificationBody = document.getElementById('classification-body');
        const loader = document.querySelector('.loader');
        const tabs = document.querySelectorAll('.tab-button');

        const showLoader = (show) => {
            loader.style.display = show ? 'block' : 'none';
        };

        const renderTable = (tableData) => {
            classificationBody.innerHTML = '';
            if (!tableData) return;

            tableData.forEach(team => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${team.position}</td>
                    <td class="team-name">
                        <img src="${team.team.crestUrl}" alt="${team.team.name}" class="team-crest">
                        ${team.team.name}
                    </td>
                    <td>${team.points}</td>
                    <td>${team.playedGames}</td>
                    <td>${team.won}</td>
                    <td>${team.draw}</td>
                    <td>${team.lost}</td>
                    <td>${team.goalsFor}</td>
                    <td>${team.goalsAgainst}</td>
                    <td>${team.goalDifference}</td>
                `;
                classificationBody.appendChild(row);
            });
        };

        const fetchClassification = async () => {
            showLoader(true);
            try {
                const response = await fetch('/.netlify/functions/fetchTabela');
                const data = await response.json();
                renderTable(data.standings[0].table);
            } catch (error) {
                console.error('Erro ao buscar classificação geral:', error);
                classificationBody.innerHTML = '<tr><td colspan="10">Erro ao carregar dados.</td></tr>';
            } finally {
                showLoader(false);
            }
        };

        const calculateTurnoClassification = (matches) => {
            const teams = {};

            matches.forEach(match => {
                const homeTeamId = match.homeTeam.id;
                const awayTeamId = match.awayTeam.id;
                const homeTeamName = match.homeTeam.name;
                const awayTeamName = match.awayTeam.name;
                // Assume crest URL is not available in match data, will need to fetch it separately or omit it
                const homeCrest = ''; // Placeholder
                const awayCrest = ''; // Placeholder


                if (!teams[homeTeamId]) {
                    teams[homeTeamId] = { id: homeTeamId, name: homeTeamName, crestUrl: homeCrest, playedGames: 0, won: 0, draw: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, points: 0 };
                }
                if (!teams[awayTeamId]) {
                    teams[awayTeamId] = { id: awayTeamId, name: awayTeamName, crestUrl: awayCrest, playedGames: 0, won: 0, draw: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, points: 0 };
                }

                if (match.status === 'FINISHED') {
                    const homeScore = match.score.fullTime.homeTeam;
                    const awayScore = match.score.fullTime.awayTeam;

                    teams[homeTeamId].playedGames++;
                    teams[awayTeamId].playedGames++;
                    teams[homeTeamId].goalsFor += homeScore;
                    teams[awayTeamId].goalsFor += awayScore;
                    teams[homeTeamId].goalsAgainst += awayScore;
                    teams[awayTeamId].goalsAgainst += homeScore;

                    if (homeScore > awayScore) {
                        teams[homeTeamId].won++;
                        teams[homeTeamId].points += 3;
                        teams[awayTeamId].lost++;
                    } else if (awayScore > homeScore) {
                        teams[awayTeamId].won++;
                        teams[awayTeamId].points += 3;
                        teams[homeTeamId].lost++;
                    } else {
                        teams[homeTeamId].draw++;
                        teams[awayTeamId].draw++;
                        teams[homeTeamId].points += 1;
                        teams[awayTeamId].points += 1;
                    }
                }
            });

            const table = Object.values(teams).map(team => ({
                team: { id: team.id, name: team.name, crestUrl: team.crestUrl },
                playedGames: team.playedGames,
                won: team.won,
                draw: team.draw,
                lost: team.lost,
                goalsFor: team.goalsFor,
                goalsAgainst: team.goalsAgainst,
                goalDifference: team.goalsFor - team.goalsAgainst,
                points: team.points
            }));

            table.sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                if (b.goalDifference !== a.goalDifference) return b.goalDifference - a.goalDifference;
                if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
                return a.team.name.localeCompare(b.team.name);
            });

            return table.map((team, index) => ({ ...team, position: index + 1 }));
        };

        const fetchTurno = async (startRound, endRound) => {
            showLoader(true);
            try {
                const response = await fetch(`/.netlify/functions/fetchMatchesByRoundRange?startRound=${startRound}&endRound=${endRound}`);
                const data = await response.json();
                const turnoTable = calculateTurnoClassification(data.matches);
                renderTable(turnoTable);
            } catch (error) {
                console.error(`Erro ao buscar turno (${startRound}-${endRound}):`, error);
                classificationBody.innerHTML = '<tr><td colspan="10">Erro ao carregar dados.</td></tr>';
            } finally {
                showLoader(false);
            }
        };

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const tabName = tab.dataset.tab;

                if (tabName === 'geral') {
                    fetchClassification();
                } else if (tabName === 'turno1') {
                    fetchTurno(1, 19);
                } else if (tabName === 'turno2') {
                    fetchTurno(20, 38);
                }
            });
        });

        // Inicialização
        document.addEventListener("DOMContentLoaded", () => {
            carregarRanking();
            criarInputsRanking();
            fetchClassification(); // Carrega a classificação geral por padrão

            // Verificar dark mode
            const isDarkMode = localStorage.getItem("darkMode") === "true";
            if (isDarkMode) document.body.classList.add("dark-mode");
        });
    </script>
</body>
</html>
