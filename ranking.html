<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking - AlphaBet 2025</title>
  <style>
    body {
      font-family: "Kanit", "Roboto", sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    .main-container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      align-items: flex-start;
    }

    .ranking-container, .vitorias-container {
      flex: 1;
      background: rgba(255, 255, 255, 0.95);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      max-height: 80vh;
      overflow-y: auto;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .ranking-container h2, .vitorias-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #007bff;
      font-size: 24px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .rodada-label {
      font-size: 16px;
      font-weight: bold;
      color: #007bff;
      min-width: 30px;
      text-align: right;
    }

    .ranking-container input {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.9);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .ranking-container input:focus {
      border-color: #007bff;
      box-shadow: 0 0 12px rgba(0, 123, 255, 0.4);
      outline: none;
    }

    #vitorias {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .vitoria-card {
      background: rgba(0, 123, 255, 0.1);
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .vitoria-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 123, 255, 0.2);
    }

    .vitoria-card strong {
      color: #007bff;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }

      .ranking-container, .vitorias-container {
        max-height: none;
        padding: 20px;
      }

      .ranking-container h2, .vitorias-container h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- Coluna 1: Inputs de ranking -->
    <div class="ranking-container">
      <h2>Ranking - Vencedores por Rodada</h2>
      <div id="inputs-ranking"></div>
    </div>

    <!-- Coluna 2: Seção de vitórias -->
    <div class="vitorias-container">
      <h2>Vitórias por Jogador</h2>
      <div id="vitorias"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
   // Configuração do Supabase
    const SUPABASE_URL = "https://leuyfasvbfwdaloapmrs.supabase.co"; // Substitua pelo seu URL do Supabase
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxldXlmYXN2YmZ3ZGFsb2FwbXJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDExMTczMzUsImV4cCI6MjA1NjY5MzMzNX0.Y_s-KMy9n_Ht2OVaxmQEjnDRniqJ_DcppQVam7uAGk4"; // Substitua pela sua chave anon do Supabase
    
    // Inicialização do cliente Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
   // Função debounce para evitar múltiplas chamadas ao servidor
    function debounce(func, wait) {
      let timeout;
      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // Cria os 38 inputs para as rodadas
    const inputsRanking = document.getElementById("inputs-ranking");
    for (let i = 1; i <= 38; i++) {
      const container = document.createElement("div");
      container.className = "input-container";

      const label = document.createElement("label");
      label.textContent = `${i}.`;
      label.className = "rodada-label";

      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = `Vencedor da Rodada ${i}`;
      input.id = `rodada-${i}`;

      container.appendChild(label);
      container.appendChild(input);
      inputsRanking.appendChild(container);

      // Adiciona o evento de input com debounce
      input.addEventListener("input", debounce(salvarRanking, 500));
    }

    // Carrega os dados salvos do Supabase
    async function carregarRanking() {
      try {
        // Busca os dados da tabela apostas
        const { data, error } = await supabaseClient
          .from('apostas')
          .select('*')
          .order('id', { ascending: false })
          .limit(1);
        
        if (error) throw error;
        
        if (!data || data.length === 0) {
          console.log("Nenhum dado de ranking encontrado");
          return;
        }

        const dadosAtuais = data[0];
        
        // Verifica se o ranking existe no registro
        if (!dadosAtuais.ranking || !Array.isArray(dadosAtuais.ranking)) {
          console.log("Ranking não encontrado ou inválido");
          return;
        }

        // Preenche os inputs
        dadosAtuais.ranking.forEach((vencedores, index) => {
          const input = document.getElementById(`rodada-${index + 1}`);
          if (input) input.value = vencedores;
        });

        // Exibe as vitórias e empates
        if (dadosAtuais.vitorias_empates) {
          exibirVitorias(dadosAtuais.vitorias_empates);
        } else {
          // Se não tiver vitórias_empates, calcula baseado no ranking
          const resultados = calcularVitoriasEmpates(dadosAtuais.ranking);
          exibirVitorias(resultados);
        }
      } catch (error) {
        console.error("Erro ao carregar ranking:", error);
      }
    }

    // Salva os dados no Supabase
    async function salvarRanking() {
      try {
        const ranking = [];
        for (let i = 1; i <= 38; i++) {
          const input = document.getElementById(`rodada-${i}`);
          ranking.push(input.value);
        }

        // Calcula as vitórias e empates
        const vitoriasEmpates = calcularVitoriasEmpates(ranking);

        // Verifica se já existe um registro
        const { data: existingData, error: queryError } = await supabaseClient
          .from('apostas')
          .select('id')
          .order('id', { ascending: false })
          .limit(1);

        if (queryError) throw queryError;

        let response;
        
        if (existingData && existingData.length > 0) {
          // Atualiza o registro existente
          response = await supabaseClient
            .from('apostas')
            .update({
              ranking: ranking,
              vitorias_empates: vitoriasEmpates
            })
            .eq('id', existingData[0].id);
        } else {
          // Cria um novo registro
          response = await supabaseClient
            .from('apostas')
            .insert({
              nome_rodada: "Ranking",
              ranking: ranking,
              vitorias_empates: vitoriasEmpates,
              jogos: [],
              apostas: {},
              resultados: {},
              placares_ocultos: false
            });
        }

        if (response.error) throw response.error;

        console.log("Dados salvos com sucesso");

        // Exibe as vitórias e empates
        exibirVitorias(vitoriasEmpates);
      } catch (error) {
        console.error("Erro ao salvar ranking:", error);
      }
    }

    // Conta as vitórias e empates de cada jogador
    function calcularVitoriasEmpates(ranking) {
      const vitoriasEmpates = {
        Jardel: { vitorias: 0, empates: 0 },
        Werbet: { vitorias: 0, empates: 0 },
        Nailton: { vitorias: 0, empates: 0 },
        Phillipe: { vitorias: 0, empates: 0 }
      };

      ranking.forEach((vencedores) => {
        const listaVencedores = vencedores.split(",").map((nome) => nome.trim());

        if (listaVencedores.length === 1 && listaVencedores[0] !== "") {
          // Vitória única
          const vencedor = listaVencedores[0];
          if (vencedor && vitoriasEmpates[vencedor]) {
            vitoriasEmpates[vencedor].vitorias++;
          }
        } else if (listaVencedores.length > 1) {
          // Empate (múltiplos vencedores)
          listaVencedores.forEach((vencedor) => {
            if (vencedor && vitoriasEmpates[vencedor]) {
              vitoriasEmpates[vencedor].empates++;
            }
          });
        }
      });

      return vitoriasEmpates;
    }

    // Exibe as vitórias e empates na página
    function exibirVitorias(resultados) {
      const vitoriasContainer = document.getElementById("vitorias");
      vitoriasContainer.innerHTML = "";

      // Converte o objeto em um array e ordena por número de vitórias (decrescente)
      const resultadosOrdenados = Object.entries(resultados).sort((a, b) => {
        const totalA = a[1].vitorias + a[1].empates;
        const totalB = b[1].vitorias + b[1].empates;
        return totalB - totalA;
      });

      resultadosOrdenados.forEach(([jogador, { vitorias, empates }]) => {
        const card = document.createElement("div");
        card.className = "vitoria-card";
        card.innerHTML = `
          <strong>${jogador}</strong>:
          ${vitorias} vitória(s),
          ${empates} empate(s)
        `;
        vitoriasContainer.appendChild(card);
      });
    }

    // Carrega os dados ao abrir a página
    window.addEventListener('DOMContentLoaded', () => {
      carregarRanking();
    });
  </script>
</body>
</html>
